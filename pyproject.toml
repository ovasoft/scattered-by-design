[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pruning-transforms"
version = "1.0.0"
description = "Code for 'Scattered by Design: Why Post-Hoc Transformation Cannot Bridge Unstructured and Structured LLM Pruning' (NeurIPS 2026)"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["src"]

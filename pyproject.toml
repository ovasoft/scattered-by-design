[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pruning-transforms"
version = "1.0.0"
description = "Code for 'Scattered by Design: Why Per-Output Pruning Resists Structured Compression' (NeurIPS 2026)"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Victor A. Omolaoye"}, {name = "Gerard de Melo"}]

[tool.setuptools.packages.find]
where = ["src"]
